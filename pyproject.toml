[project]
name = "installation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sumon Debnath", email = "debnathsumon1708@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
